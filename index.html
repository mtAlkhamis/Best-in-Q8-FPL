var seasons = [], mgrs = {}, allTime = [];
(function () {
  var seen = {};
  ROWS.forEach(function (r) { if (!seen[r[0]]) { seen[r[0]] = 1; seasons.push(r[0]); } });
  ROWS.forEach(function (r) {
    var m = mgrs[r[2]] || (mgrs[r[2]] = { en: r[2], ar: AR[r[2]], team: r[3], rows: [] });
    m.team = r[3];
    m.rows.push({ season: r[0], pos: r[1], pts: r[4], rank: r[5] });
  });
  var arSets = {};
  Object.keys(mgrs).forEach(function (k) {
    var m = mgrs[k];
    (arSets[m.ar] = arSets[m.ar] || []).push(k);
  });
  Object.keys(mgrs).forEach(function (k) {
    var m = mgrs[k];
    m.total = m.rows.reduce(function (a, r) { return a + r.pts; }, 0);
    m.count = m.rows.length;
    m.titles = m.rows.filter(function (r) { return r.pos === 1; }).length;
    m.podiums = m.rows.filter(function (r) { return r.pos <= 3; }).length;
    m.best = Math.min.apply(null, m.rows.map(function (r) { return r.pos; }));
    m.avg = (m.rows.reduce(function (a, r) { return a + r.pos; }, 0) / m.count).toFixed(2);
    m.bestRank = Math.min.apply(null, m.rows.map(function (r) { return r.rank; }));
    m.display = arSets[m.ar].length > 1 ? m.ar + ' — ' + m.team : m.ar;
    allTime.push(m);
  });
  allTime.sort(function (a, b) { return b.total - a.total; });
  allTime.forEach(function (m, i) { m.allRank = i + 1; });
})();

        '<div class="row"><span class="who">ماضي الخميس</span><span class="big">7</span></div>' +
        '<div style="font-size:18px;font-weight:700;opacity:.75">ساكن المنصة بالإيجار الطويل</div></div>' +
      '<div class="rec" style="background:#46124F;border:2px solid rgba(255,255,255,.18)"><div class="k" style="color:#04F5FF">أكثر مرات وصيف الدوري — تعادل ثلاثي</div>' +
        '<div class="row"><span style="font-size:18px;font-weight:700;color:rgba(255,255,255,.6)">ثلاث مرات لكل واحد</span><span class="big" style="font-size:48px">3</span></div>' +
        '<div style="font-size:21px;font-weight:800;line-height:1.45">ثامر الحميضي · ماضي الخميس · حمد الخميس</div></div>' +
      '<div class="rec" style="background:#46124F;border:2px solid rgba(255,255,255,.18)"><div class="k" style="color:#04F5FF">أكثر مرات مركز ثالث — تعادل خماسي</div>' +
        '<div class="row"><span style="font-size:18px;font-weight:700;color:rgba(255,255,255,.6)">مرتين لكل واحد</span><span class="big" style="font-size:48px">2</span></div>' +
        '<div style="font-size:20px;font-weight:800;line-height:1.45">مشاري الدرعة · محمد الرهيماني · ماضي الخميس · محمد الفهد · فهد الخميس</div></div>' +
      '<div class="rec" style="background:#04F5FF;color:#38003C"><div class="k" style="opacity:.7">أفضل موسم في التاريخ</div>' +
        '<div class="row"><span class="who">مشاري الخميس</span><span style="display:flex;flex-direction:column;align-items:center"><span class="big" style="font-size:50px">2585</span><span style="font-size:16px;font-weight:700;opacity:.75">نقطة</span></span></div>' +
        '<div style="font-size:18px;font-weight:700;opacity:.8">موسم 20/21 — وأفضل ترتيب عالمي على الإطلاق: <span class="num" style="font-weight:700">274</span></div></div>' +
      '<div class="rec" style="background:#2A002E;border:2px dashed rgba(255,255,255,.35)"><div class="k" style="color:#E90052;margin-bottom:4px">فشيلة الدوري — أكثر واحد جا الأخير</div>' +
        '<div style="font-size:15px;font-weight:500;color:rgba(255,255,255,.5);margin-bottom:12px">قاعد بذيل الجدول أكثر من أي أحد</div>' +
        '<div class="row"><span class="who">مبارك المطيري</span><span class="big">3</span></div>' +
        '<div class="num" style="direction:ltr;text-align:right;font-size:18px;color:rgba(255,255,255,.7)">19/20 · 23/24 · 25/26</div></div>' +
      '<div style="grid-column:1/-1;background:linear-gradient(120deg,#E90052 0%,#7A0B4A 100%);padding:26px;display:flex;gap:20px;align-items:center;flex-wrap:wrap">' +
        '<div style="font-size:62px;line-height:1">😅</div><div style="flex:1;min-width:240px">' +
        '<h3 style="margin:0 0 8px;font-size:clamp(26px,4vw,34px);font-weight:900;line-height:1">المنحوس</h3>' +
        '<p style="margin:0;font-size:clamp(17px,2.2vw,22px);font-weight:500;line-height:1.45">حمد الخميس يمتلك أفضل متوسط ترتيب في تاريخ الدوري كله — <span class="num" style="font-weight:700;background:#00FF85;color:#38003C;padding:0 8px">5.69</span> على مدى 13 موسم — ومع ذلك <span style="font-weight:900;color:#00FF85">ما رفع الكأس ولا مرة واحدة</span>.</p></div></div>' +
    '</div></div></section>' +

    '<section class="pad"><div class="wrap"><div class="hd" style="border-bottom-color:#04F5FF;margin-bottom:8px"><h2 class="sec">الترتيب التاريخي</h2><div class="s" style="color:#04F5FF">اضغط أي مشترك لتاريخه الكامل</div></div>' +
    '<p style="margin:0 0 18px;font-size:17px;font-weight:500;color:rgba(255,255,255,.6)">مجموع نقاط كل مشترك في كل المواسم اللي شارك فيها — مو ترتيب الموسم الأخير.</p>' +
    '<div class="thead"><div style="flex:0 0 40px">#</div><div style="flex:1 1 120px">المشترك</div><div style="flex:0 0 84px">النقاط</div><div style="flex:0 0 92px">مواسم</div></div>' +
    '<div class="rows">' + table + '</div></div></section>';
}

function seasonsView() {
  var cards = seasons.map(function (s) {
    var list = seasonRows(s);
    return '<div class="scard" data-season="' + s + '"><div class="num" style="font-size:34px;font-weight:700;color:#04F5FF;direction:ltr;text-align:right">' + label(s) + '</div>' +
      '<div style="font-size:15px;font-weight:700;color:rgba(255,255,255,.5);margin-top:8px">البطل</div>' +
      '<div style="font-size:20px;font-weight:800">' + esc(list[0].m.ar) + '</div>' +
      '<div style="font-size:15px;font-weight:500;color:rgba(255,255,255,.55)">' + list.length + ' مشترك</div></div>';
  }).join('');
  return '<section class="pad"><div class="wrap"><h2 class="sec">كل المواسم</h2>' +
    '<p style="margin:8px 0 24px;font-size:18px;font-weight:500;color:rgba(255,255,255,.6)">اختر موسم لترتيبه الكامل.</p>' +
    '<div class="grid-cards">' + cards + '</div></div></section>';
}

function managersView() {
  var cards = allTime.map(function (m) {
    return '<div class="mcard" data-mgr="' + esc(m.en) + '" style="border-right-color:' + accent(m.allRank) + '">' +
      '<div style="font-size:21px;font-weight:900">' + esc(m.display) + '</div>' +
      '<div style="font-size:15px;font-weight:500;color:rgba(255,255,255,.55);margin-bottom:10px">' + esc(m.team) + '</div>' +
      '<div style="display:flex;gap:14px;align-items:baseline"><span class="num" style="font-size:22px;font-weight:700;color:#00FF85">' + fmt(m.total) + '</span>' +
      '<span style="font-size:15px;font-weight:700;color:rgba(255,255,255,.5)">' + m.count + ' مواسم</span></div></div>';
  }).join('');
  return '<section class="pad"><div class="wrap"><h2 class="sec">كل المشتركين</h2>' +
    '<p style="margin:8px 0 24px;font-size:18px;font-weight:500;color:rgba(255,255,255,.6)">اضغط أي واحد لسجله في كل المواسم.</p>' +
    '<div class="grid-cards">' + cards + '</div></div></section>';
}

function seasonView(s) {
  var i = seasons.indexOf(s);
  var rows = seasonRows(s).map(function (x) {
    var a = accent(x.r.pos);
    return '<div class="trow" data-mgr="' + esc(x.m.en) + '" style="border-right-color:' + a + '">' +
      '<div class="c-rank" style="color:' + a + '">' + x.r.pos + '</div>' +
      '<div class="c-name"><b>' + esc(x.m.display) + '</b><span>' + esc(x.m.team) + '</span></div>' +
      '<div class="c-pts">' + x.r.pts + '</div><div class="c-sub">' + fmt(x.r.rank) + '</div></div>';
  }).join('');
  return '<section class="pad"><div class="wrap"><div class="back" data-go="archive">← رجوع</div>' +
    '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:5px solid #00FF85;padding-bottom:16px;margin-bottom:22px">' +
    '<div><div style="font-size:18px;font-weight:700;color:#00FF85">ترتيب الموسم</div>' +
    '<h2 class="num" style="margin:4px 0 0;font-size:clamp(44px,9vw,82px);font-weight:700;line-height:.95;direction:ltr;text-align:right">' + label(s) + '</h2></div>' +
    '<div style="display:flex;gap:8px">' +
    (i > 0 ? '<button class="btn" data-season="' + seasons[i - 1] + '">الموسم السابق</button>' : '') +
    (i < seasons.length - 1 ? '<button class="btn" data-season="' + seasons[i + 1] + '">الموسم التالي</button>' : '') +
    '</div></div>' +
    '<div class="thead"><div style="flex:0 0 40px">#</div><div style="flex:1 1 120px">المشترك</div><div style="flex:0 0 84px">النقاط</div><div style="flex:0 0 92px">عالمياً</div></div>' +
    '<div class="rows">' + rows + '</div></div></section>';
}

function managerView(en) {
  var m = mgrs[en];
  if (!m) return landingView();
  var tile = function (n, l, c) { return '<div class="tile"><div class="n"' + (c ? ' style="color:' + c + '"' : '') + '>' + n + '</div><div class="l">' + l + '</div></div>'; };
  var rows = m.rows.map(function (r) {
    var a = accent(r.pos);
    return '<div class="trow trow-m" data-season="' + r.season + '" style="border-right-color:' + a + '">' +
      '<div class="num" style="flex:0 0 68px;font-size:21px;font-weight:700;color:#04F5FF;direction:ltr;text-align:right">' + label(r.season) + '</div>' +
      '<div class="num" style="flex:0 0 44px;font-size:24px;font-weight:700;color:' + a + '">' + r.pos + '</div>' +
      '<div class="num" style="flex:1 1 80px;min-width:0;font-size:21px;font-weight:600">' + r.pts + '</div>' +
      '<div class="c-sub">' + fmt(r.rank) + '</div></div>';
  }).join('');
  return '<section class="pad"><div class="wrap"><div class="back" data-go="archive">← رجوع</div>' +
    '<div style="border-bottom:5px solid #E90052;padding-bottom:18px;margin-bottom:22px">' +
    '<div style="font-size:18px;font-weight:700;color:#E90052">ملف المشترك</div>' +
    '<h2 style="margin:6px 0 4px;font-size:clamp(32px,6vw,58px);font-weight:900;line-height:1.05">' + esc(m.ar) + '</h2>' +
    '<div style="font-size:20px;font-weight:500;color:rgba(255,255,255,.6)">' + esc(m.team) + '</div></div>' +
    '<div class="tiles">' +
      '<div class="tile" style="background:#E90052;border:0"><div class="n">' + m.titles + '</div><div class="l">ألقاب</div></div>' +
      '<div class="tile" style="background:#00FF85;color:#38003C;border:0"><div class="n">' + m.podiums + '</div><div class="l">مرات بالمراكز الثلاثة الأولى</div></div>' +
      tile(m.count, 'مواسم') + tile(fmt(m.total), 'مجموع النقاط') +
      tile(m.avg, 'متوسط الترتيب', '#04F5FF') + tile(fmt(m.bestRank), 'أفضل ترتيب عالمي', '#04F5FF') +
    '</div>' +
    '<div class="thead thead-m" style="border-bottom-color:#04F5FF"><div style="flex:0 0 68px">الموسم</div><div style="flex:0 0 44px">المركز</div><div style="flex:1 1 80px">النقاط</div><div style="flex:0 0 92px">عالمياً</div></div>' +
    '<div class="rows">' + rows + '</div></div></section>';
}

var cmpA = null, cmpB = null;
function compareView() {
  var A = mgrs[cmpA || allTime[0].en], B = mgrs[cmpB || allTime[1].en];
  cmpA = A.en; cmpB = B.en;
  var opts = function (sel) {
    return allTime.map(function (m) {
      return '<option value="' + esc(m.en) + '"' + (m.en === sel ? ' selected' : '') + '>' + esc(m.display) + '</option>';
    }).join('');
  };
  var shared = A.rows.filter(function (r) { return B.rows.some(function (x) { return x.season === r.season; }); });
  var aw = 0, bw = 0;
  shared.forEach(function (r) {
    var o = null; B.rows.forEach(function (x) { if (x.season === r.season) o = x; });
    if (r.pos < o.pos) aw++; else bw++;
  });
  var h2h = aw === bw ? 'تعادل ' + aw + ' — ' + bw + ' 😐'
    : (aw > bw ? A.ar : B.ar) + ' متقدم ' + Math.max(aw, bw) + ' مقابل ' + Math.min(aw, bw);
  var G = '#00FF85', P = '#FF5C9E', N = 'rgba(255,255,255,.75)';
  var row = function (l, a, b, hi, fa, fb) {
    var better = a === b ? 0 : (hi ? (a > b ? 1 : 2) : (a < b ? 1 : 2));
    return '<div class="cmp-row"><div class="num" style="font-size:24px;font-weight:700;color:' + (better === 1 ? G : N) + '">' + (fa !== undefined ? fa : a) + '</div>' +
      '<div style="font-size:15px;font-weight:700;color:rgba(255,255,255,.6)">' + l + '</div>' +
      '<div class="num" style="font-size:24px;font-weight:700;text-align:left;color:' + (better === 2 ? P : N) + '">' + (fb !== undefined ? fb : b) + '</div></div>';
  };
  return '<section class="pad"><div class="wrap">' +
    '<div class="hd" style="border-bottom-color:#04F5FF"><div class="s" style="color:#04F5FF">وجه لوجه</div><h2 class="sec" style="margin-top:6px">مقارنة بين مشتركين</h2></div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:24px">' +
    '<div><div style="font-size:15px;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:6px">المشترك الأول</div><select id="selA" style="border:2px solid #00FF85">' + opts(A.en) + '</select></div>' +
    '<div><div style="font-size:15px;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:6px">المشترك الثاني</div><select id="selB" style="border:2px solid #E90052">' + opts(B.en) + '</select></div></div>' +
    '<div style="background:linear-gradient(120deg,#E90052 0%,#7A0B4A 100%);padding:22px;margin-bottom:20px">' +
    '<div style="font-size:16px;font-weight:700;opacity:.8;margin-bottom:6px">تقابلوا في ' + shared.length + ' موسم</div>' +
    '<div style="font-size:clamp(20px,3vw,28px);font-weight:900;line-height:1.35">' + esc(h2h) + '</div></div>' +
    '<div class="cmp-hd"><div style="font-size:18px;font-weight:900;color:#00FF85">' + esc(A.display) + '</div>' +
    '<div style="font-size:14px;font-weight:700;color:rgba(255,255,255,.5)">المقارنة</div>' +
    '<div style="font-size:18px;font-weight:900;color:#FF5C9E;text-align:left">' + esc(B.display) + '</div></div>' +
    '<div class="rows">' +
      row('ألقاب', A.titles, B.titles, true) +
      row('مرات بالمراكز الثلاثة الأولى', A.podiums, B.podiums, true) +
      row('مجموع النقاط', A.total, B.total, true, fmt(A.total), fmt(B.total)) +
      row('مواسم', A.count, B.count, true) +
      row('متوسط الترتيب', +A.avg, +B.avg, false, A.avg, B.avg) +
      row('أفضل مركز', A.best, B.best, false) +
      row('أفضل ترتيب عالمي', A.bestRank, B.bestRank, false, fmt(A.bestRank), fmt(B.bestRank)) +
    '</div></div></section>';
}

function render() {
  var h = location.hash.replace(/^#\/?/, '');
  var parts = h.split('/');
  var html, active = 'home';
  if (parts[0] === 'season' && parts[1]) { html = seasonView(decodeURIComponent(parts[1])); }
  else if (parts[0] === 'mgr' && parts[1]) { html = managerView(decodeURIComponent(parts[1])); }
  else if (parts[0] === 'gw') { html = gwView(parts[1] ? +parts[1] : LAST_GW); active = 'gw'; }
  else if (parts[0] === 'archive') { html = homeView(); active = 'archive'; }
  else if (parts[0] === 'seasons') { html = seasonsView(); active = 'seasons'; }
  else if (parts[0] === 'managers') { html = managersView(); active = 'managers'; }
  else if (parts[0] === 'compare') { html = compareView(); active = 'compare'; }
  else { html = landingView(); }
  app.innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.className = 'tab' + (t.getAttribute('data-go') === active ? ' on' : '');
  });
  var sa = document.getElementById('selA'), sb = document.getElementById('selB');
  if (sa) sa.onchange = function () { cmpA = sa.value; app.innerHTML = compareView(); bindSelects(); };
  if (sb) sb.onchange = function () { cmpB = sb.value; app.innerHTML = compareView(); bindSelects(); };
}
function bindSelects() {
  var sa = document.getElementById('selA'), sb = document.getElementById('selB');
  if (sa) sa.onchange = function () { cmpA = sa.value; app.innerHTML = compareView(); bindSelects(); };
  if (sb) sb.onchange = function () { cmpB = sb.value; app.innerHTML = compareView(); bindSelects(); };
}

document.addEventListener('click', function (e) {
  var ctl = e.target.closest('[data-sort],[data-open]');
  if (ctl) {
    if (ctl.hasAttribute('data-sort')) gwSort = ctl.getAttribute('data-sort');
    else { var id = +ctl.getAttribute('data-open'); gwOpen = gwOpen === id ? null : id; }
    var y = window.scrollY;
    app.innerHTML = gwView(gwCur || LAST_GW);
    window.scrollTo(0, y);
    return;
  }
  var el = e.target.closest('[data-gw],[data-season],[data-mgr],[data-go]');
  if (!el) return;
  if (el.hasAttribute('data-gw')) location.hash = '#/gw/' + el.getAttribute('data-gw');
  else if (el.hasAttribute('data-season')) location.hash = '#/season/' + encodeURIComponent(el.getAttribute('data-season'));
  else if (el.hasAttribute('data-mgr')) location.hash = '#/mgr/' + encodeURIComponent(el.getAttribute('data-mgr'));
  else {
    var g = el.getAttribute('data-go');
    location.hash = g === 'home' ? '#/' : '#/' + g;
  }
  window.scrollTo(0, 0);
});
window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });
render();
</script>
</body>
</html>
